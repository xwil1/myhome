name: Daily contribution

on:
  schedule:
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Append daily log
        run: |
          mkdir -p logs
          echo "- $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z') daily check-in" >> logs/daily.md

      - name: Commit and push
        run: |
          git config user.name "ayxwi"
          git config user.email "274959179+xwil1@users.noreply.github.com"
          git add logs/daily.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: daily log"
          git push
